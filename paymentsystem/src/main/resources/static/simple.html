<!DOCTYPE html>
<html>
<head>
    <title>Simple API Test</title>
</head>
<body>
    <h1>TossBank API 테스트</h1>
    <button onclick="testHealth()">헬스체크</button>
    <button onclick="testSignup()">회원가입 테스트</button>
    <div id="result"></div>

    <script>
        async function testHealth() {
            try {
                const response = await fetch('/actuator/health');
                const data = await response.json();
                document.getElementById('result').innerHTML = 'Health: ' + JSON.stringify(data);
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error;
            }
        }

        async function testSignup() {
            try {
                const response = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: 'webtest@example.com',
                        password: 'Test123!',
                        name: '웹테스트',
                        phoneNumber: '010-9999-9999'
                    })
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = 'Signup: ' + JSON.stringify(data);
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error;
            }
        }
    </script>
</body>
</html>
